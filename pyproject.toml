[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-data-guardrails"
version = "0.1.0"
description = "Eval suite and claim-aware guardrail for LLMs that answer questions about data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sourabh Koul" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
ldg = "llm_data_guardrails.__main__:main"

[tool.setuptools.packages.find]
include = ["llm_data_guardrails*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
